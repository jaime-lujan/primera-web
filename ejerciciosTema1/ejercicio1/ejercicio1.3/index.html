<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Ejercicio 1.3</title>
		<link rel="stylesheet" href="css/estilo.css">
    </head>
    <body>
        <main>
            <div>
                <table class="table1">
                    <caption>Tabla prueba 1</caption>
                    <tr>
                        <th>columna 1</th>
                        <th>columna 2</th>
                        <th>columna 3</th>
                        <th>columna 4</th>
                    </tr>
                    <tr>
                        <td>col1</td>
                        <td colspan="2">col2</td>
                        <!-- <td>ocupada por col2</td> -->
                        <td rowspan="2">col3</td>
                    </tr>
                    <tr>
                        <td>colum1</td>
                        <td>colum2</td>
                        <td>colum4</td>
                        <!-- <td>ocupada por col3</td> -->
                    </tr>
                </table>
                <table class="table2">
                    <caption>Tabla prueba 2</caption>
                    <tr>
                        <th>columna 1</th>
                        <th>columna 2</th>
                        <th>columna 3</th>
                        <th>columna 4</th>
                    </tr>
                    <tr>
                        <td class="lineapar">col1</td>
                        <td class="lineapar" colspan="2">col2</td>
                        <!-- <td>ocupada por col2</td> -->
                        <td class="lineapar" >col3</td>
                    </tr>
                    <tr>
                        <td class="lineaimpar">colum1</td>
                        <td class="lineaimpar" rowspan="2">colum2</td>
                        <td class="lineaimpar">colum3</td>
                        <td class="lineaimpar">colum4</td>
                    </tr>
                    <tr>
                        <td class="lineapar">column1</td>
                        <!-- <td>ocupada por col2</td> -->
                        <td class="lineapar">column3</td>
                        <td class="lineapar">column4</td>
                    </tr>
                        <td class="lineaimpar">colu1</td>
                        <td class="lineaimpar">colu2</td>
                        <td class="lineaimpar">colu3</td>
                        <td class="lineaimpar">colu4</td>
                    </tr>
                </table>
            </div>
        </main>
    </body>
</html>
